name: Verify CEGIS-Bellman Certificates

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Build libm-free Rust verifier
        run: python core/rust_verifier/build.py
      - name: Run unit and regression tests
        run: pytest -v tests/test_core_intervals.py tests/test_models_analytics.py tests/test_mvs_regression.py
      - name: Run standalone formal auditor
        run: |
          python -u core/audit_standalone.py certificates/cegis_certificates.json.xz
          python -u core/audit_standalone.py certificates/cegis_certificates.json.xz --pure-python --model mvs_canonical
