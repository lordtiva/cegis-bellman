[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cegis_bellman"
version = "0.1.0"
description = "Modular 1D CEGIS-LP Bellman barrier certification engine and institutional development models"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Marcelo Segura" },
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.12",
  "numba>=0.59",
  "matplotlib>=3.8",
  "typst>=0.11",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "models*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
